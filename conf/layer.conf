# Experimental: Torizon OS upstream build on a recent mainline/stable kernel
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "tz-mainline"
BBFILE_PATTERN_tz-mainline = "^${LAYERDIR}/"
BBFILE_PRIORITY_tz-mainline = "99"
LAYERDEPENDS_tz-mainline = "core toradex-bsp-common-layer"
LAYERSERIES_COMPAT_tz-mainline = "wrynose"
